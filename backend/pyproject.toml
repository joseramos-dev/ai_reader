[project]
name = "tts-backend"
version = "0.2.0"
description = "FastAPI backend for multi-engine TTS (Pocket-TTS, Kokoro, Piper)"
requires-python = ">=3.10,<3.15"
dependencies = [
    "pocket-tts>=2.1.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.13.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.21",
    "scipy>=1.5.0",
    "soundfile>=0.12.0",
    "sqlalchemy>=2.0",
    "pypdf>=4.0",
    "numpy>=1.24",
    "httpx>=0.27",
    "kokoro>=0.9.4",
    "misaki>=0.9.4",
    "piper-tts>=1.3.0",
    "onnxruntime>=1.17",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
python-preference = "only-managed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
